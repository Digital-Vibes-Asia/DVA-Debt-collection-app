<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DVA Pulse — Debt Collection CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

<style>
/* ---------- Design tokens ---------- */
:root {
  /* Brand */
  --brand:        #E11D48;
  --brand-deep:   #9F1239;
  --brand-soft:   #FFF1F3;
  --brand-ink:    #4C0519;

  /* Ink + surface */
  --ink:          #0B0B0F;
  --ink-2:        #1A1A21;
  --ink-3:        #3F3F46;
  --muted:        #71717A;
  --muted-2:      #A1A1AA;
  --line:         #E7E5E0;
  --line-2:       #EFEDE8;
  --surface:      #F6F5F1;
  --surface-2:    #FBFAF7;
  --card:         #FFFFFF;

  /* Functional */
  --success:      #15803D;
  --success-soft: #ECFDF3;
  --warn:         #B45309;
  --warn-soft:    #FEF3C7;
  --danger:       #B91C1C;
  --danger-soft:  #FEE2E2;

  /* Vox AI accent */
  --vox:          #00B8D9;
  --vox-deep:     #006C82;
  --vox-soft:     #E6FAFD;

  /* WhatsApp green */
  --wa:           #25D366;
  --wa-deep:      #128C7E;
  --wa-bubble:    #DCF8C6;

  /* Type */
  --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --font-serif: 'Instrument Serif', ui-serif, Georgia, serif;

  /* Radii */
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
  --r-xl: 20px;

  /* Shadows */
  --shadow-sm: 0 1px 2px rgba(11,11,15,0.04), 0 1px 1px rgba(11,11,15,0.03);
  --shadow-md: 0 4px 14px rgba(11,11,15,0.06), 0 1px 2px rgba(11,11,15,0.04);
  --shadow-lg: 0 24px 48px -16px rgba(11,11,15,0.18), 0 8px 24px -8px rgba(11,11,15,0.08);
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-sans);
  font-feature-settings: 'ss01', 'cv11';
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body {
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.45;
}

button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; }

/* Utility */
.mono { font-family: var(--font-mono); font-feature-settings: 'ss02', 'cv02'; }
.serif { font-family: var(--font-serif); }
.tnum { font-variant-numeric: tabular-nums; }

/* Scrollbars */
.thin-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.thin-scroll::-webkit-scrollbar-thumb { background: #D4D4D8; border-radius: 4px; }
.thin-scroll::-webkit-scrollbar-track { background: transparent; }

/* Reset focus */
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}

/* App shell layout */
#app-root { min-height: 100vh; }

/* Subtle red glow used for status indicators */
@keyframes pulseGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(225,29,72,0.45); }
  50%      { box-shadow: 0 0 0 6px rgba(225,29,72,0); }
}
.live-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--brand);
  animation: pulseGlow 1.8s ease-out infinite;
}
.live-dot.vox { background: var(--vox); animation: pulseGlow 1.8s ease-out infinite; box-shadow: 0 0 0 0 rgba(0,184,217,0.45); }
.live-dot.wa  { background: var(--wa); }

@keyframes voxBar {
  0%, 100% { transform: scaleY(0.35); }
  50%      { transform: scaleY(1); }
}
.vox-bars { display: inline-flex; gap: 2px; align-items: center; height: 14px; }
.vox-bars span {
  display: block;
  width: 2px;
  background: currentColor;
  border-radius: 1px;
  height: 100%;
  transform-origin: center;
  animation: voxBar 1.1s ease-in-out infinite;
}
.vox-bars span:nth-child(2) { animation-delay: 0.15s; }
.vox-bars span:nth-child(3) { animation-delay: 0.30s; }
.vox-bars span:nth-child(4) { animation-delay: 0.45s; }
.vox-bars span:nth-child(5) { animation-delay: 0.60s; }
</style>
</head>
<body>
<div id="app-root"></div>
<script>
window.PULSE_TWEAK_DEFAULTS = {
  "accent": "midnight",
  "density": "cozy",
  "showMobileCompanion": false,
  "voxLive": true
};
</script>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
